services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuepass
      POSTGRES_USER: queuepass_owner
      POSTGRES_PASSWORD: CHANGE_ME
    ports: ["5432:5432"]
    volumes: [qp_pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://queuepass_app:CHANGE_ME@postgres:5432/queuepass
      REDIS_URL: redis://redis:6379
    ports: ["3001:3001"]
    depends_on: [postgres, redis]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  qp_pgdata:
